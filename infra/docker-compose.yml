# Domain-bounded Ops-Hub stack.
# From the repo root:
#   docker compose -f infra/docker-compose.yml up -d --build
#
# Original monolith repo is unchanged; this compose belongs to cbc-copilot-final.

# Pinned. Without it the project name comes from the directory holding this
# file - `infra` - while the running stack was created as `cbc-final`. Two
# projects then own containers with the same fixed container_name, and the
# second `up` dies on "container name is already in use" partway through,
# having already recreated some services.
name: cbc-final

# Every Azure service runs locally as an emulator - DocumentDB Local for the
# database, Floci-AZ for Blob Storage and Key Vault - and the app talks to each
# exactly as it will to Azure: TLS, real SDKs, real connection strings. Going to
# production changes these values and nothing else. Each is overridable from the
# shell or infra/.env, which is how the Azure values arrive.
x-app-env: &app-env
  # Azure DocumentDB speaks the MongoDB wire protocol. tlsAllowInvalidCertificates
  # is for the emulator's self-signed certificate; the production guard in
  # cbc.shared.config refuses it anywhere real.
  MONGODB_URI: ${MONGODB_URI:-mongodb://cbc:${MONGO_ROOT_PASSWORD:-cbc_local_dev}@documentdb:10260/cbc_opshub?authSource=admin&authMechanism=SCRAM-SHA-256&tls=true&tlsAllowInvalidCertificates=true&retryWrites=false}
  MONGODB_DB: cbc_opshub
  # The credential the read-only MCP servers connect with - catalog, bid-docs.
  # DocumentDB users are cluster-level, so this is not derived from
  # MONGODB_URI; docker/documentdb-init.sh creates the user locally, and
  # production is handed its cluster's read-only user the same way.
  MONGODB_READONLY_URI: ${MONGODB_READONLY_URI:-mongodb://cbc_catalog_ro:${MONGODB_READONLY_PASSWORD:-cbc_catalog_ro_local_dev}@documentdb:10260/cbc_opshub?authSource=admin&authMechanism=SCRAM-SHA-256&tls=true&tlsAllowInvalidCertificates=true&retryWrites=false}
  # DocumentDB runs multi-document transactions (30 s cap); pytest stays off.
  MONGODB_TRANSACTIONS: ${MONGODB_TRANSACTIONS:-1}
  # Blob keeps the durable copy of every project and price-book file; the bind
  # mounts below stay the working copy. The key is a placeholder - Floci checks
  # none in dev mode - kept short and fake so no real-looking storage key is ever
  # committed (GitHub push protection rejects the published development key).
  STORAGE_BACKEND: ${STORAGE_BACKEND:-azure}
  AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-DefaultEndpointsProtocol=https;AccountName=devstoreaccount1;AccountKey=ZmxvY2ktZGV2LW5vdC1hLXNlY3JldA==;BlobEndpoint=https://floci:4577/devstoreaccount1;}
  AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-cbc}
  # Secrets load from Key Vault at container start (docker/entrypoint.sh) and
  # fall back to the mounted .env when the vault is unreachable.
  KEY_VAULT_URL: ${KEY_VAULT_URL:-https://floci:4577/devstoreaccount1-keyvault}
  # Floci's certificate is self-signed; the entrypoint fetches it from here and
  # trusts it for the Azure clients only. Empty in production.
  AZURE_EMULATOR_CA_URL: ${AZURE_EMULATOR_CA_URL-https://floci:4577/_floci/tls-cert}
  # Where it lands. Set here rather than exported by the entrypoint so that
  # `docker compose exec` - the seed and sync scripts - sees it too. Empty in
  # production, and its presence is what switches the clients to emulator terms.
  AZURE_EMULATOR_CA: ${AZURE_EMULATOR_CA-/tmp/azure-emulator-ca.pem}
  STORAGE_ROOT: /app/data/projects
  PRICEBOOK_DIR: /app/data/pricebooks
  REFERENCE_DIR: /app/reference-library
  TEMPLATES_DIR: /app/templates
  APP_SECRET_KEY: ${APP_SECRET_KEY:-cbc-local-dev-key-change-me}
  INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-cbc-local-dev-key-change-me}
  INTERNAL_AUTH: ${INTERNAL_AUTH:-jwt}
  INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET:-cbc-local-dev-key-change-me}
  INTERNAL_JWT_SECRET_PREVIOUS: ${INTERNAL_JWT_SECRET_PREVIOUS:-}
  APP_ENV: ${APP_ENV:-development}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  CORS_ORIGINS: ${CORS_ORIGINS:-https://app.<MY_DOMAIN>}
  MALWARE_SCAN: ${MALWARE_SCAN:-clamd}
  MALWARE_SCAN_REQUIRED: ${MALWARE_SCAN_REQUIRED:-0}
  CLAMD_HOST: ${CLAMD_HOST:-clamav}
  CLAMD_PORT: ${CLAMD_PORT:-3310}
  # The memory graph. Optional: with Neo4j down a bid still runs, and the curator
  # catches up on its next sync.
  NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
  NEO4J_USER: ${NEO4J_USER:-neo4j}
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-cbc_graph_local_dev}
  NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}

x-domain-volumes: &domain-volumes
  - ../data/projects:/app/data/projects
  - ../data/pricebooks:/app/data/pricebooks
  - ../.claude:/app/.claude:ro
  - ../data/reference-library:/app/reference-library:ro
  - ../.env:/app/.env
  - cbc_cache:/app/.cache
  - claude_home:/home/cbc/.claude

x-worker-env: &worker-env
  <<: *app-env
  WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-5}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
  WORKER_JOB_TIMEOUT_SECONDS: ${WORKER_JOB_TIMEOUT_SECONDS:-3600}
  WORKER_MAX_TURNS: ${WORKER_MAX_TURNS:-60}
  # Extraction is a multi-phase wave; it carries the pipeline budget, and each leg
  # is capped separately. See claude_pass.LIMITS / WAVE_LEG_MAX_TURNS.
  WORKER_PIPELINE_TIMEOUT_SECONDS: ${WORKER_PIPELINE_TIMEOUT_SECONDS:-10800}
  WORKER_PIPELINE_MAX_TURNS: ${WORKER_PIPELINE_MAX_TURNS:-200}
  WORKER_WAVE_LEG_MAX_TURNS: ${WORKER_WAVE_LEG_MAX_TURNS:-80}
  WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-3}
  CLAUDE_SANDBOX: ${CLAUDE_SANDBOX:-process}
  # Set CLAUDE_SANDBOX=docker and mount /var/run/docker.sock on the worker
  # to isolate Claude on the llm-only network.
  CBC_SANDBOX_NETWORK: ${CBC_SANDBOX_NETWORK:-cbc-final-llm}
  ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}

x-api-health: &api-health
  test:
    [
      "CMD",
      "python",
      "-c",
      "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/api/health', timeout=4).status==200 else 1)",
    ]
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 20s

services:
  # Azure DocumentDB, locally. Pinned: the job queue's partial unique index with
  # `$in` needs documentdb#449, and documentdb-init.sh leans on the emulator's
  # internals to create the read-only user.
  documentdb:
    image: ghcr.io/documentdb/documentdb/documentdb-local:pg17-0.117.0
    container_name: cbc-final-documentdb
    restart: unless-stopped
    # The stock entrypoint, plus the read-only user MONGODB_READONLY_URI names.
    entrypoint: ["bash", "/documentdb-init.sh"]
    environment:
      USERNAME: cbc
      PASSWORD: ${MONGO_ROOT_PASSWORD:-cbc_local_dev}
      MONGODB_READONLY_PASSWORD: ${MONGODB_READONLY_PASSWORD:-cbc_catalog_ro_local_dev}
    expose:
      - "10260"
    # Published to the host so the integration suites can run from a normal
    # shell. Bound to 127.0.0.1: a dev database whose password defaults to
    # `cbc_local_dev` has no business being reachable from the laptop's network.
    ports:
      - "127.0.0.1:10260:10260"
    volumes:
      # Not `documentdb_data`: another checkout of this app uses that name under
      # the same compose project, and its data has a different schema.
      - opshub_documentdb:/data
      - ./docker/documentdb-init.sh:/documentdb-init.sh:ro
    # Healthy once the read-only user can sign in, so the catalog servers'
    # credential exists before anything that hands it out starts.
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "mongodb://cbc_catalog_ro:${MONGODB_READONLY_PASSWORD:-cbc_catalog_ro_local_dev}@localhost:10260/?authSource=admin&authMechanism=SCRAM-SHA-256&tls=true&tlsAllowInvalidCertificates=true",
          "--eval",
          "db.adminCommand({ping: 1}).ok",
        ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  # Azure Blob Storage and Key Vault, locally. TLS on, because the Key Vault SDK
  # refuses a bearer token over plain http - and it is what production speaks.
  # FLOCI_AZ_HOSTNAME puts `floci` in the certificate, so the app can verify it.
  # No docker.sock: that is only for the emulated services that start real
  # engines, and neither of these does.
  floci:
    image: floci/floci-az:0.13.0
    container_name: cbc-final-floci
    restart: unless-stopped
    environment:
      FLOCI_AZ_TLS_ENABLED: "true"
      FLOCI_AZ_HOSTNAME: floci
      FLOCI_AZ_STORAGE_MODE: persistent
    expose:
      - "4577"
    # Published on 127.0.0.1 for native runs, the storage tests and seeding the
    # vault from the host (apps/backend/scripts/seed_key_vault.py).
    ports:
      - "127.0.0.1:4577:4577"
    volumes:
      - floci_data:/app/data

  # The memory graph: vendors, multipliers, customers, catalog items, reference data
  # and every approved bid's workflow, connected. DocumentDB stays the system of
  # record; the memory curator (modules/memory) keeps this a connected copy of it
  # plus what approved bids taught. 5.26 is the LTS line. Browser on
  # http://localhost:7474, bolt on 7687 - both bound to this machine only.
  neo4j:
    image: neo4j:5.26-community
    container_name: cbc-final-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-cbc_graph_local_dev}
      # The image reads every NEO4J_* variable as a server setting and refuses
      # to start on one it does not know, so the health check's copy of the
      # password goes under another name.
      GRAPH_HEALTH_PASSWORD: ${NEO4J_PASSWORD:-cbc_graph_local_dev}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${GRAPH_HEALTH_PASSWORD}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  clamav:
    image: clamav/clamav:stable
    container_name: cbc-final-clamav
    restart: unless-stopped
    expose:
      - "3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc -w 2 127.0.0.1 3310 | grep -q PONG"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  platform:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
      target: api
    image: cbc-final-platform:latest
    container_name: cbc-final-platform
    restart: unless-stopped
    expose:
      - "8001"
    environment:
      <<: *app-env
      SERVICE_AUDIENCE: platform
    volumes: *domain-volumes
    depends_on:
      documentdb:
        condition: service_healthy
      floci:
        condition: service_healthy
      clamav:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      <<: *api-health
      # Building every index on a fresh DocumentDB volume takes a couple of
      # minutes; a 25 s grace marked the API unhealthy before it had started.
      start_period: 300s

  worker:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
      target: worker
    image: cbc-final-worker:latest
    container_name: cbc-final-worker
    restart: unless-stopped
    environment:
      <<: *worker-env
      WORKER_CLAIM_ALL: "1"
      SERVICE_AUDIENCE: platform
      CBC_SANDBOX_IMAGE: cbc-final-worker:latest
    volumes:
      - ../data/projects:/app/data/projects
      - ../data/pricebooks:/app/data/pricebooks
      - ../.claude:/app/.claude:ro
      - ../data/reference-library:/app/reference-library:ro
      - ../.env:/app/.env:ro
      - cbc_cache:/app/.cache
      - claude_home:/home/cbc/.claude
    depends_on:
      documentdb:
        condition: service_healthy
      floci:
        condition: service_healthy
      platform:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    image: cbc-final-web:latest
    container_name: cbc-final-web
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      PLATFORM_URL: http://platform:8001
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-cbc-local-dev-key-change-me}
      INTERNAL_AUTH: ${INTERNAL_AUTH:-jwt}
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET:-cbc-local-dev-key-change-me}
      APP_ENV: ${APP_ENV:-development}
      # NextAuth v5 builds every redirect from this. Without it the standalone
      # server falls back to its own bind address and signing out lands on
      # http://0.0.0.0:3000 - a dead page. `trustHost: true` is set in auth.ts
      # and nginx forwards Host and X-Forwarded-Host, but neither is consulted
      # for the base: verified by posting a signout with a valid CSRF token and
      # an explicit callbackUrl, which came back as 0.0.0.0:3000 until this was
      # set.
      #
      # It pins ONE origin. Reaching the app by LAN address or Cloudflare
      # tunnel still works, but a sign-out from there redirects here, so set
      # this to whichever origin people actually use.
      AUTH_URL: ${AUTH_URL:-http://localhost}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-}
      AUTH_SECRET: ${AUTH_SECRET:-cbc-opshub-local-dev-secret-change-in-production}
      AUTH_TRUST_HOST: "true"
    depends_on:
      platform:
        condition: service_healthy

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: cbc-final-litellm
    profiles: ["oss"]
    restart: unless-stopped
    expose:
      - "4000"
    entrypoint: ["bash", "/litellm-entrypoint.sh"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-cbc-local-dev}
      # Soft gateway budget. Set to the same number as WORKER_MAX_COST_USD_PER_DAY for defense in depth.
      LITELLM_MAX_BUDGET: ${LITELLM_MAX_BUDGET:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      NVIDIA_NIM_API_KEY: ${NVIDIA_NIM_API_KEY:-}
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://host.docker.internal:11434}
      # NIM free tier is 40 req/min. Lower it if NVIDIA still 429s at the
      # window edge - their window and ours are not the same clock.
      NIM_RPM: ${NIM_RPM:-40}
      # nim_pacer is resolved by import, not from the rendered config's dir.
      PYTHONPATH: /app
    volumes:
      - ./docker/litellm.config.yaml:/app/config.yaml:ro
      - ./docker/nim_pacer.py:/app/nim_pacer.py:ro
      - ./docker/litellm-entrypoint.sh:/litellm-entrypoint.sh:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - llm

  # Parsing-domain worker: claims parse_document only.
  #
  # No longer behind a profile. It used to be `gpu`, which was coherent while a
  # missing GPU meant PARSER_URL was empty and parsing was off. Parsing is now on
  # whenever PARSER_API_KEY is set, so leaving this profiled would queue
  # parse_document jobs with no worker to claim them - and `defer_if_parsing`
  # would hold every extraction behind a parse that never starts.
  parser:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
      target: worker
    image: cbc-final-worker:latest
    container_name: cbc-final-parser
    restart: unless-stopped
    environment:
      <<: *worker-env
      WORKER_DOMAIN: parsing
      WORKER_CONCURRENCY: ${PARSER_WORKER_CONCURRENCY:-1}
      SERVICE_AUDIENCE: platform
    volumes:
      - ../data/projects:/app/data/projects
      - ../data/pricebooks:/app/data/pricebooks
      - ../.claude:/app/.claude:ro
      - ../data/reference-library:/app/reference-library:ro
      - ../.env:/app/.env
      - cbc_cache:/app/.cache
      - claude_home:/home/cbc/.claude
    depends_on:
      documentdb:
        condition: service_healthy
      floci:
        condition: service_healthy
      platform:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx:
    image: nginx:1.27-alpine
    container_name: cbc-final-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      web:
        condition: service_started
      platform:
        condition: service_healthy

# No certbot or tunnel service: this machine serves no public domain. nginx still
# mounts the certificate volumes for its 443 block; renew them by hand, or bring
# the certbot service back, before pointing a real domain here.
volumes:
  neo4j_data:
  opshub_documentdb:
  floci_data:
  claude_home:
  cbc_cache:
  clamav_data:
  certbot_conf:
  certbot_www:

networks:
  default:
    name: cbc-final
  llm:
    name: cbc-final-llm
    internal: true
