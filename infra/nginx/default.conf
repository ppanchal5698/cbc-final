# Map for WebSocket connection upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Preserve forwarded protocol (e.g. from Cloudflare tunnel or edge reverse proxy)
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Preserve forwarded host
map $http_x_forwarded_host $forwarded_host {
    default $http_x_forwarded_host;
    ''      $host;
}

# HTTP: Serves ACME challenges and reverse proxies to internal services
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Match application maximum upload size (200MB)
    client_max_body_size 200M;

    # Rewrite any internal upstream redirects so client never receives localhost redirects
    proxy_redirect http://localhost:3000/ /;
    proxy_redirect http://web:3000/ /;
    proxy_redirect http://127.0.0.1:3000/ /;

    # ACME-challenge webroot for Let's Encrypt HTTP-01 verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Caching for Next.js immutable static assets
    location /_next/static/ {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $forwarded_host;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # NextAuth.js authentication endpoints (handled by Next.js web service)
    location /api/auth/ {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $forwarded_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # Next.js authenticated proxy routes (handles SSE streams, document downloads)
    location /api/proxy/ {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $forwarded_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Direct platform API (e.g., /api/health and external integrations)
    location /api/ {
        proxy_pass http://platform:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $forwarded_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # Frontend application (Next.js server-rendered pages and client-side routing)
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $forwarded_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}

# HTTPS: Secure TLS reverse proxy
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    # Certificates
    ssl_certificate /etc/letsencrypt/live/<MY_DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<MY_DOMAIN>/privkey.pem;

    # Modern TLS configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Match application maximum upload size (200MB)
    client_max_body_size 200M;

    # Rewrite any internal upstream redirects so client never receives localhost redirects
    proxy_redirect http://localhost:3000/ /;
    proxy_redirect http://web:3000/ /;
    proxy_redirect http://127.0.0.1:3000/ /;

    # Caching for Next.js immutable static assets
