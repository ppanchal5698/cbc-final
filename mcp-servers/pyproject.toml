[project]
name = "cbc-mcp-servers"
version = "0.1.0"
description = "MCP servers for the CBC Estimating Copilot (PDF, pricebook, calc, storage, P21)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0",
    "pdfplumber>=0.11",
    "PyMuPDF>=1.24",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "Pillow>=10.0",
]

# `_runtime` is the shared stdio helper. Servers are still launched by path
# (.claude/settings.json); installing this distribution makes `import _runtime`
# work without every server.py editing sys.path.
[tool.setuptools]
py-modules = ["_runtime"]

[project.optional-dependencies]
# OCR fallback for scanned bid sets. pytesseract also needs the tesseract binary
# installed on the host - the pdf-tools server degrades with a clear message without it.
ocr = ["pytesseract>=0.3.10"]

[tool.ruff]
line-length = 100
target-version = "py311"
