[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cbc"
version = "0.1.0"
description = "CBC Estimating Copilot modular monolith backend (Phase 0 skeleton)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic[email]>=2.9",
  "uvicorn[standard]>=0.32,<1.0",
  "motor>=3.6,<4.0",
  "pymongo>=4.9,<5.0",
  "bcrypt>=4.2,<5.0",
  "python-multipart>=0.0.17",
  "jinja2>=3.1,<4.0",
  "cryptography>=43.0",
  "PyJWT>=2.9,<3.0",
  "boto3>=1.34,<2.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

[project.scripts]
cbc-api = "cbc.api.main:run"
cbc-worker = "cbc.worker.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
