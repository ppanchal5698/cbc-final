# Live `cbc` package: the modular monolith under apps/backend/src.
#
#   pip install -e .
#   # or: pip install -e ./apps/backend
#
# Pre-monolith trees live under archive/pre-monolith/ (not installed here).
# Prefer: cd apps/backend && pytest
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cbc"
version = "1.0.0"
description = "CBC Estimating Copilot modular monolith (apps/backend)"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["apps/backend/src"]
include = ["cbc*"]

[tool.setuptools.package-data]
cbc = ["modules/extraction/api/artifacts/*.json"]
