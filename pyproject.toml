# Live `cbc` package: the modular monolith under apps/backend/src.
#
#   pip install -e .
#   # or: pip install -e ./apps/backend
#
# Prefer: cd apps/backend && pytest
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cbc"
version = "1.0.0"
description = "CBC Estimating Copilot modular monolith (apps/backend)"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["apps/backend/src"]
include = ["cbc*"]

[tool.setuptools.package-data]
cbc = ["modules/extraction/api/artifacts/*.json"]

# Pyrefly (VS Code extension) otherwise infers the repo root as the only import
# root, which holds neither package: `cbc` lives under apps/backend/src, and the
# hooks import their siblings by bare name via a runtime loader.
[tool.pyrefly]
search-path = ["apps/backend/src", ".claude/hooks"]
